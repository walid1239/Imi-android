name: IMI Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle configuration
        run: gradle --version

      - name: Configure Firebase Android app when secret is available
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            test -s app/google-services.json
            if [ -z "$FIREBASE_PROJECT_ID" ]; then
              echo "::error::Set the FIREBASE_PROJECT_ID secret to the project you own before using Firebase config."
              exit 1
            fi
            jq -e --arg project_id "$FIREBASE_PROJECT_ID" '
              .project_info.project_id == $project_id
              and any(.client[]; .client_info.android_client_info.package_name == "com.walid.chat")
            ' app/google-services.json >/dev/null
            echo "Firebase Android config validated for the protected project ID and package com.walid.chat."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured. Build and tests may run, but no APK release artifact will be published."
          fi

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Run IMI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          wait-for-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK for device verification
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.firebase_config.outputs.configured == 'true' && 'IMI-debug-apk-firebase-configured' || 'IMI-debug-apk-no-firebase-config' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  security-rules:
    name: Firebase security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install security test dependencies
        run: npm install --no-audit --no-fund

      - name: Build trusted Firebase Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run build --prefix functions

      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools@13.29.2 emulators:exec --only firestore,storage --project demo-imi-security "npm run test:rules"
