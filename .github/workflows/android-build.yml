name: IMI Android CI
# Root, Functions, and Web lockfiles are committed; CI uses npm ci for reproducible installs.
# Firebase Emulator commands use the exact firebase-tools@15.37.0 pin and Node.js 22.
# Feature branches are validated by pull_request; push runs are reserved for main/master to avoid duplicate CI on PR commits.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/web-ci.yml'
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/**'
      - 'functions/src/account.ts'
      - 'data/curriculum.json'
      - 'scripts/seed-curriculum.cjs'
      - 'scripts/test-teacher-emulator.cjs'
      - 'web/src/components/phone-otp-form.tsx'
      - 'web/src/app/login/page.tsx'
      - 'docs/HANDOFF.md'
      - 'web/src/components/profile-panel.tsx'
  pull_request:
    branches: [ main, master, 'feature/**' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/web-ci.yml'
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/**'
      - 'functions/src/account.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle configuration
        run: gradle --version

      - name: Configure Firebase Android app when secret is available
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] || [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p app
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            fi
            test -s app/google-services.json
            if [ -z "$FIREBASE_PROJECT_ID" ]; then
              echo "::error::Set the FIREBASE_PROJECT_ID secret to the project you own before using Firebase config."
              exit 1
            fi
            project_id="$(printf '%s' "$FIREBASE_PROJECT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if ! jq -e 'type == "object" and (.project_info | type == "object") and (.client | type == "array")' app/google-services.json >/dev/null; then
              echo "::error::GOOGLE_SERVICES_JSON is not valid Firebase Android configuration JSON (or is missing project_info/client)."
              exit 1
            fi
            actual_project_id="$(jq -r '.project_info.project_id // empty' app/google-services.json)"
            if [ "$actual_project_id" != "$project_id" ]; then
              echo "::error::Firebase project ID mismatch. JSON project_id='$actual_project_id'; FIREBASE_PROJECT_ID secret does not match after trimming whitespace."
              exit 1
            fi
            if ! jq -e 'any(.client[]?; .client_info.android_client_info.package_name == "com.walid.chat")' app/google-services.json >/dev/null; then
              echo "::error::Firebase JSON does not contain Android package com.walid.chat."
              echo "::error::Configured package names: $(jq -r '[.client[]?.client_info.android_client_info.package_name // empty] | join(", ")' app/google-services.json)"
              exit 1
            fi
            echo "Firebase Android config validated: project_id='$actual_project_id', package='com.walid.chat'."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither GOOGLE_SERVICES_JSON nor GOOGLE_SERVICES_JSON_BASE64 is configured. The APK will be test-only and will not connect to Firebase."
          fi

      - name: Run unit tests and assemble debug APK
        id: android_build
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Upload debug APK for device verification
        if: always() && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.firebase_config.outputs.configured == 'true' && 'IMI-debug-apk-firebase-configured' || 'IMI-debug-apk-no-firebase-config' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Only a deliberate manual run publishes/replaces the public preview release.
      # PR checks never publish binaries and Production remains untouched.
      - name: Publish APK to the IMI preview release
        if: ${{ steps.android_build.outcome == 'success' && steps.firebase_config.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/imi-teacher-admin-preview' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imi-preview
          name: IMI Preview APK
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Automated preview build from commit ${{ github.sha }}.
            This is a preview APK, not a production release.

      # MainActivity creates an anonymous Firebase Auth user on launch.
      # Never launch a Firebase-configured APK against the production project in CI.
      - name: Skip live-Firebase Android smoke test
        if: steps.firebase_config.outputs.configured == 'true'
        run: echo "Skipped device launch to prevent anonymous Auth writes to the real Firebase project."

      - name: Run IMI on Android emulator
        if: steps.firebase_config.outputs.configured != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest

  # Firebase CLI 15.37.0 Emulator Suite requires JDK 21+.
  security-rules:
    name: Firebase security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install security test dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and unit-test trusted Firebase Functions
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npm test --prefix functions

      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore,storage --project demo-imi-security "npm run test:rules"
