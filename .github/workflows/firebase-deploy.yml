name: IMI Firebase Cloud Deployment

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Exact Firebase project ID (must be verified as owned/authorized)"
        required: true
        type: string
      confirm_deploy:
        description: "Type DEPLOY to authorize deploying Functions and Firebase rules"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: imi-firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, test, and deploy Firebase backend
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project ID input
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if ! [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::Invalid Firebase project ID format."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build trusted Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run build --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.29.2

      - name: Deploy Functions and security rules
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          firebase deploy --project "$PROJECT_ID" --only functions,firestore:rules,storage

      - name: Report deployed target
        if: success()
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: echo "Firebase deployment completed for explicitly selected project: $PROJECT_ID"
