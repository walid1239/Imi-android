name: IMI Web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
      - 'infra/coturn/**'
      - 'docs/turn-windows.md'
      - 'docs/call-test-plan.md'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
      - 'infra/coturn/**'
      - 'docs/turn-windows.md'
      - 'docs/call-test-plan.md'

permissions:
  contents: read

# Push and pull_request events for the same feature branch share one slot.
# New commits supersede stale queued/in-progress CI instead of building a backlog.
concurrency:
  group: imi-web-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Audit web dependencies (high and critical block CI)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:health

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Audit Cloud Functions dependencies (high and critical block CI)
        run: npm audit --audit-level=high
      - run: npm test

  turn-infra:
    name: Validate Coturn Compose configuration (no server start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable CI-only environment file
        run: |
          cat > infra/coturn/.env <<'EOF'
          TURN_SECRET=CI_DUMMY_SECRET_NOT_FOR_USE
          TURN_HOST=turn.example.test
          TURN_PORT=3478
          TURN_REALM=turn.example.test
          TURN_MIN_PORT=49160
          TURN_MAX_PORT=49200
          TURN_EXTERNAL_IP=203.0.113.10/172.30.250.10
          EOF
      - name: Validate Compose syntax and local secret ignore rule
        run: |
          docker compose -f infra/coturn/docker-compose.yml config --quiet
          git check-ignore infra/coturn/.env

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - name: Install Functions Admin SDK dependencies for Emulator-only seed scripts
        run: npm install --prefix functions --no-audit --no-fund
      - run: npm run emulators:test
      - name: Verify curriculum and legacy lesson seeds in a disposable Firestore Emulator
        run: >-
          npx --yes firebase-tools@13.29.2 emulators:exec
          --only firestore --project demo-imi-academy
          "node scripts/seed-curriculum.cjs --emulator --project=demo-imi-academy &&
          node scripts/verify-academy-seed.cjs"


  playwright-e2e:
    name: Playwright browser tests against Firebase Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-imi-playwright
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-imi-playwright.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_FIREBASE_EMULATORS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and compile Functions for the emulator
        working-directory: .
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run build --prefix functions
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E against disposable Auth, Firestore and Functions emulators
        working-directory: .
        run: >-
          npx --yes firebase-tools@13.29.2 emulators:exec
          --only auth,firestore,functions,storage
          --project demo-imi-playwright
          "curl -fsS http://127.0.0.1:9099/emulator/v1/projects/demo-imi-playwright/accounts >/dev/null &&
          cd functions && node scripts/seed-e2e.cjs &&
          cd ../web && npm run e2e"
