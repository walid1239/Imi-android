name: IMI Web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
      - 'infra/coturn/**'
      - 'docs/turn-windows.md'
      - 'docs/call-test-plan.md'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
      - 'infra/coturn/**'
      - 'docs/turn-windows.md'
      - 'docs/call-test-plan.md'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:health

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test


  turn-infra:
    name: Validate Coturn Compose configuration (no server start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable CI-only environment file
        run: |
          cat > infra/coturn/.env <<'EOF'
          TURN_SECRET=CI_DUMMY_SECRET_NOT_FOR_USE
          TURN_HOST=turn.example.test
          TURN_PORT=3478
          TURN_REALM=turn.example.test
          TURN_MIN_PORT=49160
          TURN_MAX_PORT=49200
          TURN_EXTERNAL_IP=203.0.113.10/172.30.250.10
          EOF
      - name: Validate Compose syntax and local secret ignore rule
        run: |
          docker compose -f infra/coturn/docker-compose.yml config --quiet
          git check-ignore infra/coturn/.env

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run emulators:test
