# Rendered by entrypoint.sh. Never place a real secret in this tracked template.
listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${TURN_EXTERNAL_IP}

fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}
server-name=${TURN_REALM}

min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# Do not expose the administrative CLI or act as a LAN scanning proxy.
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Authenticated UDP/TCP listener; relay media is UDP only.
no-tls
no-dtls
no-tcp-relay
stale-nonce=600
user-quota=8
total-quota=100
max-bps=1000000
bps-capacity=10000000

# Optional TLS later: remove no-tls/no-dtls, set tls-listening-port=5349,
# mount a valid certificate and private key, then publish 5349/tcp only.
